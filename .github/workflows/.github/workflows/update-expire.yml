- name: Generate strict 1-day rolling expiry for 2026
        run: |
          # Вычисляем точное время ровно на 24 часа вперед от текущего момента
          EXPIRE_TIME=$(date -u -d "+1 day" +%s)
          
          # Записываем заголовки: лимит 30ГБ, интервал обновления 24 часа и суточный таймер
          cat << EOF > _headers
          /Full.yaml
            subscription-userinfo: upload=0; download=0; total=32212254720; expire=$EXPIRE_TIME
            profile-update-interval: 24
          EOF
