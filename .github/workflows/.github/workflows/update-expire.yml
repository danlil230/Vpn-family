name: Update Subscription Expiry

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Обновление каждый день в полночь

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate headers with 30GB limit and rolling expiry
        run: |
          # Вычисляем дату истечения на 30 дней вперед в рамках текущего года
          EXPIRE_TIME=$(date -u -d "+30 days" +%s)
          
          # Записываем актуальные данные в файл _headers для Cloudflare Pages
          cat << EOF > _headers
          /Full.yaml
            subscription-userinfo: upload=0; download=0; total=32212254720; expire=$EXPIRE_TIME
            profile-update-interval: 24
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add _headers
          git commit -m "Auto-update subscription headers and traffic limits" || exit 0
          git push
