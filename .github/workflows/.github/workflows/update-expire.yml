name: Auto Update Expiry Date

on:
  schedule:
    # Запускается каждый день в полночь по UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate next day expiry
        run: |
          # Вычисляем timestamp для даты через 2 дня от текущего момента
          EXPIRE_TIME=$(date -u -d "+2 days" +%s)
          
          # Перезаписываем файл _headers свежим таймером и лимитом в 30 ГБ
          cat << EOF > _headers
          /Full.yaml
            subscription-userinfo: upload=0; download=0; total=32212254720; expire=$EXPIRE_TIME
            profile-update-interval: 24
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "Auto Expiry Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add _headers
          git commit -m "Auto-update subscription expiry timer [skip ci]" || exit 0
          git push
