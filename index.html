<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейный VPN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #666666;
            margin-bottom: 30px;
            font-size: 1rem;
            max-width: 400px;
        }
        .button-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background-color: #0366d6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
            display: inline-block;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-telegram {
            background-color: #229ED9;
        }
        .btn-telegram:hover {
            background-color: #1b7fb3;
        }
        #toast {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #28a745;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <h1>Семейный VPN</h1>
    <p>Подписка активна. Скопируйте ссылку для приложения или заглядывайте в наш Telegram-канал за новостями.</p>

    <div class="button-container">
        <button class="btn" onclick="copySubscriptionLink()">📋 Скопировать ссылку</button>
        <a href="https://t.me/+c-jXwsei3IRlYjgy" class="btn btn-telegram" target="_blank">✈️ Наш Telegram</a>
    </div>

    <div id="toast">Ссылка успешно скопирована в буфер обмена!</div>

    <script>
        function copySubscriptionLink() {
            const subUrl = window.location.origin + window.location.pathname.replace(/\/?$/, '/') + 'Full.yaml';
            
            navigator.clipboard.writeText(subUrl).then(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2500);
            }).catch(err => {
                alert('Не удалось скопировать автоматически. Ссылка: ' + subUrl);
            });
        }
    </script>

</body>
</html>
